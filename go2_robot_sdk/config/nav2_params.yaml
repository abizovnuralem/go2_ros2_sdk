controller_server:
  ros__parameters:
    use_sim_time: False

    # [수정] 제어 주기 (3.0 -> 10.0 Hz)
    # 원본: 3.0 (너무 느려서 장애물 반응 늦음)
    # 수정: 10.0 (Jetson에서 충분히 처리가능하며 장애물 회피 반응성 확보)
    controller_frequency: 5.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0

      # [수정] 최대 속도 제한 (3.0 -> 0.8)
      # 원본: 3.0 (좁은 실내에서 위험, 위치 추정 실패 원인)
      # 수정: 0.8 (안전 속도)
      max_vel_x: 2.0
      max_vel_y: 2.0
      max_vel_theta: 2.0 # 원본 3.0은 회전이 너무 빠름

      min_speed_xy: 0.0
      max_speed_xy: 2.8 # max_vel_x와 동일하게
      min_speed_theta: 0.0

      # [수정] 가속도 제한 (2.5 -> 1.5)
      # 너무 급격한 가속은 로봇이 미끄러지거나 위치를 잃게 함
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.0

      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 12
      sim_time: 1.5 # 원본 1.2 -> 1.5 (조금 더 멀리 보고 예측)
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle:
        scale: 0.02
      PathAlign:
        scale: 24.0
        forward_point_distance: 0.1
      GoalAlign:
        scale: 20.0
        forward_point_distance: 0.1
      PathDist:
        scale: 32.0
      GoalDist:
        scale: 24.0
      RotateToGoal:
        scale: 32.0
        slowing_factor: 5.0
        lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      # [수정] 업데이트 빈도 (3.0 -> 5.0 Hz)
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 5 # 원본 6 -> 5 (연산량 최적화)
      height: 5
      resolution: 0.05
      footprint: "[ [0.360, 0.200], [0.360, -0.200], [-0.450, -0.200], [-0.450, 0.200] ]"
      footprint_padding: 0.03

      # [수정] static_layer 제거
      # 로컬 맵은 센서 데이터(Voxel/Obstacle)만 보는 것이 회색 영역 주행에 유리함
      plugins: ["obstacle_layer", "inflation_layer"]

      # [주석 처리된 원본]
      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.2
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      resolution: 0.05

      # [수정] Unknown Space 추적 (False -> True)
      # 원본: False (Unknown을 Free로 보거나 닫아버림)
      # 수정: True (Planner가 Unknown 영역을 인식하고 allow_unknown: true 옵션으로 지나가게 함)
      track_unknown_space: True

      static_map: True
      footprint: "[ [0.380, 0.230], [0.380, -0.230], [-0.480, -0.230], [-0.480, 0.230] ]"
      footprint_padding: 0.03

      # [수정] Obstacle Layer 추가
      # 원본: ["static_layer", "voxel_layer", "inflation_layer"]
      # 수정: Voxel(3D) 대신 Obstacle(2D) 레이어 사용 권장 (Jetson 부하 감소 및 설정 단순화)
      #      반드시 센서 데이터(obstacle_layer)가 있어야 맵에 없는 장애물을 피해서 경로를 생성함.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True

      # [추가된 블록] 동적 장애물 반영을 위해 추가
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # [주석 처리된 원본] Voxel Layer
      # 3D 센서를 쓴다면 이걸 써야 하지만, 2D Scan만 쓴다면 Obstacle Layer가 훨씬 가볍고 효율적임.
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: True
      #   ...

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 # 원본 1.0 -> 3.0 (좁은 곳 통과 용이)
        inflation_radius: 0.55   # 원본 0.25 -> 0.55 (벽에서 안전거리 확보)

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # [수정] 플러그인 변경 (GridBased -> NavFnPlanner)
    planner_plugins: ["GridBased"]
    use_sim_time: False # 원본 True -> False 수정

    # [교체된 블록] NavFnPlanner (가볍고 일반적인 주행용)
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true       # A* 사용 (최단경로 보장)
      allow_unknown: true    # [중요] True로 해야 맵의 회색(Unknown) 영역을 경로로 생성함

    # [주석 처리된 원본] SmacPlannerHybrid
    # 이유: Jetson에서 돌리기에 무겁고, allow_unknown 처리가 복잡함. Go2는 Ackermann(차량)이 아님.
    # GridBased:
    #   plugin: "nav2_smac_planner/SmacPlannerHybrid"
    #   tolerance: 3.0
    #   allow_unknown: false
    #   motion_model_for_search: "REEDS_SHEPP"
    #   ... (나머지 Smac 파라미터들 생략 없이 주석 처리 했다고 가정) ...
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    # [수정] True -> False
    # 중요: 원본에 True로 되어 있었음. 실제 로봇 주행 시 반드시 False여야 TF 에러 없이 복구 동작 수행 가능.
    use_sim_time: False

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
